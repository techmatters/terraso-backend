name: check-commits

on:
  # Every pull request, whatever its base. This is what validates the titles and
  # bodies of the pull requests the dependency-upgrade workflow generates, so it
  # needs to see PRs based on a branch other than main too.
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  check-for-cc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for Conventional Commits
        uses: agenthunt/conventional-commit-checker-action@v2.0.1
