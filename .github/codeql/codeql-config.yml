name: "CodeQL config"

# Exclude specific files from CodeQL analysis.
paths-ignore:
  # Dev-only helper that refreshes a developer's local ~/secrets/.env from
  # env.sample. It prints the backup/template FILE PATHS (never any values),
  # but CodeQL's py/clear-text-logging-sensitive-data heuristic flags them as
  # "sensitive" purely because the paths derive from the SECRETS_DIR variable
  # name. It's a false positive, and the script has no production/security
  # surface, so exclude just this one file (not all of scripts/).
  - scripts/refresh_env.py
