[project]
name = "terraso_backend"
readme = "README.md"
version = "1.0"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.110",
    "dj-database-url==3.1.2",
    "django==6.1.2",
    "django-cors-headers==4.9.0",
    "django-dirtyfields==1.9.9",
    "django-filter==26.2",
    "django-naomi==0.8",
    "django-oauth-toolkit==3.4.1",
    "django-safedelete==1.5.0",
    "django-ses==4.8.0",
    "django-storages==1.14.6",
    "django-structlog==10.1.0",
    "fiona==1.10.1",
    # Held at 3.11.x: the third-party soil-id dependency pins gdal==3.11.*, and the
    # Dockerfile pins system libgdal 3.11.3 to match. Do not upgrade until soil-id relaxes.
    "gdal==3.11.3",
    "geopandas==1.2.0",
    "graphene-django==3.2.3",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "posthog==7.66.0",
    "prettyconf==3.0.1",
    "psycopg==3.3.6",
    "pyjwt[crypto]==2.15.1",
    "pyproj==3.8.0",
    "python-magic==0.4.27",
    "requests==2.34.2",
    "rules==3.5",
    "sentry-sdk[django]==2.71.0",
    "shapely==2.2.0",
    "soil-id",
]

[dependency-groups]
lint = ["ruff==0.16.10"]
dev = [
    { include-group = "lint" },
    "deepdiff==9.1.0",
    "freezegun==1.5.5",
    "gdown==6.4.2",
    "ipdb==0.13.13",
    "jsonpath-ng==1.9.1",
    "mixer==7.2.2",
    "moto==5.2.3",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "respx==0.23.1",
]

[tool.uv.sources]
soil-id = { url = "https://github.com/techmatters/soil-id-algorithm/archive/refs/tags/2026-09-30.0.zip" }

[tool.uv]
no-binary-package = ["fiona"]
required-version = ">=0.6.0"

[tool.ruff]
exclude = ["migrations"]
line-length = 100
required-version = "==0.16.10"

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.ruff.lint]
# Explicit pin of ruff's historical default rule set (E4/E7/E9/F) plus isort (I).
# Ruff 0.16 expanded its default set to 413 rules (365 violations in this repo
# at pin time); adopting that is a deliberate lint-policy change, not part of a
# dependency upgrade.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E203"]
