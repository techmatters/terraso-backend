default_install_hook_types:
-   pre-commit
-   commit-msg

repos:
-   repo: local
    hooks:
    -   id: check_api_schema
        name: Check API Schema
        language: system
        entry: make check_api_schema
        pass_filenames: false

-   repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.9.0
    hooks:
    -   id: pre-commit-update

-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run --only-group lint ruff check --fix
        language: system
        types: [python]
    -   id: ruff-format
        name: ruff format
        entry: uv run --only-group lint ruff format
        language: system
        types: [python]

-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]
        args: []
